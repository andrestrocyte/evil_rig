subject_id: mouse01
phase: centering
n_trials: 50
random_seed: 1
centering_threshold_deg: 8.0

ports:
  bpod_port: AUTO
  dio_config_port: AUTO
  dio_stream_port: AUTO
  baudrate: 1312500
  bpod_serial_channel: 1

timing:
  quiescence_s: 3.0
  inter_trial_min_s: 3.0
  choice_timeout_s: 20.0
  choice_blank_s: 1.0
  post_reward_s: 1.0
  timeout_noise_s: 2.0
  post_timeout_s: 1.0
  choice_loop_stall_s: 0.1
  output_verification_timeout_s: 0.15

wheel:
  gain_deg_per_mm: 4.0

reward:
  matched_pump_s: 0.08
  opposite_pump_s: 0.04

licks:
  source: capacitive
  bpod_port: 1
  optical_clock: streamdio
  channels: [14]
  high_only: true
  power_output_channel: 13
  power_required: true
  cap_touch_min_high_threshold: 250
  cap_touch_delta_high: 120
  cap_touch_delta_low: 90

speaker:
  sample_interval_us: 100
  frequency_hz: 6000.0
  volume: 1.0
  gate_active_high: true
  required: true

display:
  width:
  height:
  distance_mm: 100.0
  pixel_size_mm: 0.114
  choice_distance_deg: 35.0
  choice_center_threshold_deg: 1.0
  rotated_choice_axis: true
  invert_wheel_movement: true
  display_index: 1
  auto_size_to_display: true
  window_x:
  window_y:
  fullscreen: false
  noframe: true
  fps: 60
  pre_trial_black_s: 0.0
  feedback_hold_s: 0.6

frame2ttl:
  enabled: true
  input_channel: 5
  input_pin: 6
  patch_size_px: 64
  patch_margin_px: 16
  patch_corner: bottom_right
  barcode_enabled: true
  barcode_preamble_high_frames: 12
  barcode_preamble_low_frames: 12
  barcode_one_high_frames: 6
  barcode_zero_high_frames: 6
  barcode_inter_bit_low_frames: 6
  choice_flash_enabled: true

engagement:
  idle_timeout_s: 60.0
  max_consecutive_failures: 10

camera:
  frequency_hz: 30
  exposure_us: 10000
  record_video: true
  required: true
  backend: spinnaker
  save_dir: data/videos

monitor:
  enabled: true
  display_index: 0
  width: 1500
  height: 940
  fps: 30
  history_s: 20.0
  trial_history: 10
  force_sample_hz: 80.0
  wheel_sample_hz: 60.0
  screen_fps: 12.0
  camera_fps: 15.0
  camera_preview_width: 520
  camera_preview_height: 390
  task_preview_width: 220
  task_preview_height: 120
  task_preview_rotate_left: true
  streamdio_status_interval_s: 30.0
  record_path: auto

video:
  record_video: true
  export_spinnaker_summary: true
  duplicate_preview_video: false

integrations:
  mm_soundcard_status: true
  mm_alyx_register: false
  mm_flir_roi_gui: true

welfare:
  subjects_dir: subjects
  water_target_ml:
  append_session_water: true
  max_cumulative_reward_ul:
  require_current_weight: true
  max_weight_age_days: 1

animal_use:
  enabled: true
  certification_path: ../certifications/centering_50_rig.json
  max_certification_age_days: 30
  max_calibration_age_days: 30
  max_calibration_residual_ul: 0.5
  require_clean_git: true
  require_local_storage: true
  require_camera: true
  require_speaker: true
  require_licks: true
  require_operator_confirmation: true
  hardware_failsafe_revision:

session_export:
  layout: mm_hierarchy
  manifest: true
  config_snapshot: true
  export_csv_on_finalize: true
  export_timeline: true
  streamdio_chunk_s: 0
  streamdio_memory_mode: full
  streamdio_wal_fsync_s: 1.0
  streamdio_recent_events: 50000

results_dir: data/sessions
