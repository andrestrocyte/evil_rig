<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">evil_rig logo</title>
  <desc id="desc">An evil purple head-fixed mouse turning a vertical LEGO-style wheel beside a reward spout.</desc>
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b464ff"/>
      <stop offset="0.55" stop-color="#8438d0"/>
      <stop offset="1" stop-color="#592080"/>
    </linearGradient>
    <linearGradient id="purpleDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e2cac"/>
      <stop offset="1" stop-color="#351044"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#201827"/>
      <stop offset="0.58" stop-color="#0c090e"/>
      <stop offset="1" stop-color="#33203f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1ecf5"/>
      <stop offset="0.5" stop-color="#aaa0b2"/>
      <stop offset="1" stop-color="#5f5667"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="#ffffff"/>

  <!-- Head-fixed restraint tube -->
  <g filter="url(#softShadow)">
    <path d="M111 307h342c42 0 75 34 75 76v127c0 43-33 77-75 77H111c-45 0-81-36-81-81V388c0-45 36-81 81-81z"
          fill="url(#tube)" stroke="#080609" stroke-width="18"/>
    <path d="M111 323c-35 0-64 29-64 65v118c0 36 29 65 64 65"
          fill="none" stroke="#8d3bd0" stroke-width="11"/>
    <g fill="none" stroke="#080609" stroke-width="16">
      <path d="M165 312c-28 61-28 207 0 270"/>
      <path d="M239 312c-28 61-28 207 0 270"/>
      <path d="M313 312c-28 61-28 207 0 270"/>
    </g>
    <g fill="none" stroke="#9d55da" stroke-width="6" opacity="0.9">
      <path d="M165 326c-20 58-20 184 0 242"/>
      <path d="M239 326c-20 58-20 184 0 242"/>
      <path d="M313 326c-20 58-20 184 0 242"/>
    </g>
    <path d="M112 330h297M111 559h298" fill="none" stroke="#33203f" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <ellipse cx="453" cy="447" rx="70" ry="140" fill="#0b080d" stroke="#080609" stroke-width="16"/>
    <ellipse cx="453" cy="447" rx="53" ry="119" fill="none" stroke="#8d3bd0" stroke-width="7"/>
  </g>

  <!-- Thin mouse tail emerging from the rear of the tunnel -->
  <path d="M118 571C65 614 19 584 37 548c14-28 50-23 39 8"
        fill="none" stroke="#080609" stroke-width="16" stroke-linecap="round"/>
  <path d="M118 571C65 614 19 584 37 548c14-28 50-23 39 8"
        fill="none" stroke="#c36be8" stroke-width="7" stroke-linecap="round"/>

  <!-- Headbar and skull mount -->
  <path d="M486 304v-75h172v78" fill="none" stroke="#080609" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M486 304v-75h172v78" fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M456 310h77v78h-77z" fill="url(#metal)" stroke="#080609" stroke-width="12" stroke-linejoin="round"/>
  <path d="M467 323h55M467 375h55" fill="none" stroke="#f1ecf5" stroke-width="4" opacity="0.7"/>
  <circle cx="478" cy="347" r="9" fill="#8c3ed0" stroke="#080609" stroke-width="5"/>
  <circle cx="511" cy="347" r="9" fill="#8c3ed0" stroke="#080609" stroke-width="5"/>

  <!-- Side-profile mouse head: round ear, cheek and tapered muzzle -->
  <circle cx="520" cy="350" r="86" fill="url(#purple)" stroke="#080609" stroke-width="18"/>
  <circle cx="520" cy="350" r="47" fill="#f0a0c5" stroke="#080609" stroke-width="8"/>
  <path d="M486 357c12-33 45-49 73-29" fill="none" stroke="#d18aff" stroke-width="6" stroke-linecap="round"/>
  <path d="M438 397c15-52 67-78 128-72 63 6 92 48 128 75 33 25 97 22 127 53 25 26 6 59-29 64-51 8-97-20-142-38-33-13-55-1-69 38-18 52-101 50-143 15-40-33-33-94 0-135z"
        fill="url(#purple)" stroke="#080609" stroke-width="18" stroke-linejoin="round"/>
  <path d="M711 415c43 4 80 17 105 44-35-13-69-14-105-3"
        fill="#d18aff" opacity="0.34"/>

  <!-- Evil but unmistakably mouse-like face -->
  <ellipse cx="650" cy="406" rx="40" ry="51" fill="#ffffff" stroke="#080609" stroke-width="11"/>
  <ellipse cx="667" cy="413" rx="14" ry="23" fill="#bd1f3b" stroke="#080609" stroke-width="5"/>
  <circle cx="662" cy="402" r="5" fill="#ffffff"/>
  <path d="M604 354l91 36" fill="none" stroke="#080609" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="824" cy="470" rx="22" ry="19" fill="#f06b91" stroke="#080609" stroke-width="8"/>
  <ellipse cx="817" cy="464" rx="6" ry="5" fill="#ffffff" opacity="0.7"/>
  <path d="M642 478c43 27 99 31 146 6" fill="none" stroke="#080609" stroke-width="9" stroke-linecap="round"/>
  <path d="M748 497l31 2-17 40z" fill="#ffffff" stroke="#080609" stroke-width="6" stroke-linejoin="round"/>
  <path d="M566 438c29 13 43 28 51 52" fill="none" stroke="#4b176f" stroke-width="8" stroke-linecap="round"/>
  <path d="M585 462l-17 11M596 474l-16 16M710 441l25-7M715 452l28-1" fill="none" stroke="#d18aff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <g fill="none" stroke="#080609" stroke-width="5" stroke-linecap="round">
    <path d="M791 468l86-34M797 480l94 2M789 492l83 39"/>
  </g>
  <g fill="#4b176f">
    <circle cx="786" cy="465" r="4"/><circle cx="790" cy="478" r="4"/><circle cx="784" cy="490" r="4"/>
  </g>

  <!-- Vertical LEGO-style decision wheel -->
  <g filter="url(#softShadow)">
    <circle cx="596" cy="669" r="154" fill="#0a080b" stroke="#080609" stroke-width="14"/>
    <circle cx="596" cy="669" r="112" fill="#ffffff" stroke="#080609" stroke-width="11"/>
    <g fill="none" stroke="#080609" stroke-width="14" stroke-linecap="round">
      <path d="M596 669V566"/>
      <path d="M596 669l88-53"/>
      <path d="M596 669l88 53"/>
      <path d="M596 669v103"/>
      <path d="M596 669l-88 53"/>
      <path d="M596 669l-88-53"/>
    </g>
    <g fill="none" stroke="#8d3bd0" stroke-width="6" stroke-linecap="round">
      <path d="M596 669V574M596 669l81-49M596 669l81 49M596 669v95M596 669l-81 49M596 669l-81-49"/>
    </g>
    <g fill="none" stroke="#8d3bd0" stroke-width="7" stroke-linecap="round">
      <path d="M596 518v24M596 796v24M445 669h24M723 669h24M489 562l17 17M686 759l17 17M489 776l17-17M686 579l17-17"/>
    </g>
    <circle cx="596" cy="669" r="40" fill="url(#purple)" stroke="#080609" stroke-width="12"/>
    <circle cx="596" cy="669" r="11" fill="#d6a2ff"/>
  </g>

  <!-- Forepaws gripping and turning the wheel -->
  <g fill="none" stroke-linecap="round">
    <path d="M442 492c43 13 115 37 178 70" stroke="#080609" stroke-width="38"/>
    <path d="M442 492c43 13 115 37 178 70" stroke="#7930bc" stroke-width="22"/>
    <path d="M438 515c33 22 63 48 86 78" stroke="#080609" stroke-width="38"/>
    <path d="M438 515c33 22 63 48 86 78" stroke="#9948dd" stroke-width="22"/>
  </g>
  <g fill="url(#purple)" stroke="#080609" stroke-width="12">
    <ellipse cx="645" cy="574" rx="51" ry="37" transform="rotate(20 645 574)"/>
    <ellipse cx="538" cy="607" rx="51" ry="37" transform="rotate(43 538 607)"/>
  </g>
  <g fill="none" stroke="#e0b1ff" stroke-width="5" stroke-linecap="round">
    <path d="M617 567l43 16M622 555l45 17M628 545l43 16M512 596l34 31M521 586l35 31M530 578l33 29"/>
  </g>

  <!-- Wheel rotation marks -->
  <path d="M458 736c-34-64-34-133 0-195" fill="none" stroke="#8b3bd0" stroke-width="9" stroke-linecap="round"/>
  <path d="M457 540l-38 24 44 15" fill="none" stroke="#8b3bd0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sucrose reward spout -->
  <path d="M930 336h-55l-38 107" fill="none" stroke="#080609" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M930 336h-55l-38 107" fill="none" stroke="url(#metal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M925 343h-45" fill="none" stroke="#f1ecf5" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <circle cx="836" cy="448" r="11" fill="#d8d1df" stroke="#080609" stroke-width="5"/>

  <!-- Family wordmark, matching evil_caiman -->
  <text x="500" y="970" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif"
        font-size="130" font-weight="800" letter-spacing="-3" fill="#050405">evil_rig</text>
</svg>
