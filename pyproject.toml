[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpod-hf-dm"
version = "0.1.0"
description = "Head-fixed decision-making task (wheel + force) on bpod-core with StreamDIO bringup compatibility"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HF DM Team" }]
dependencies = [
  "bpod-core>=0.1.0a12",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "pyserial>=3.5",
  "pygame>=2.5",
]

[project.optional-dependencies]
sound = ["pybpod-soundcard-module"]
dev = ["pytest>=8.0", "mypy>=1.8"]

[project.scripts]
hf-dm-run = "hf_dm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hf_dm = ["configs/*.yaml"]
