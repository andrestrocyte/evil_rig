[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpod-hf-dm"
version = "0.1.2"
description = "Head-fixed decision-making task (wheel + force) on bpod-core and StreamDIO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "HF DM Team" }]
dependencies = [
  "bpod-core==0.1.0a15",
  # The StreamDIO host driver, from its development branch until the first release.
  "streamdio @ git+https://github.com/MathiasMahn/StreamDIO@development#subdirectory=software",
  "numpy==1.26.4",
  "pyyaml==6.0.3",
  "pyserial==3.5",
  "pygame==2.6.1",
]

[project.optional-dependencies]
# pybpod_soundcard_module, from MM_PyBpod2 (not on PyPI)
sound = ["MM-PybBod2 @ git+https://github.com/andrestrocyte/MM_PyBpod2.git@a176c0e38520a4f29554198ae30711a08546d75d"]
video = ["opencv-python>=4.0"]
mm = ["MM-PybBod2 @ git+https://github.com/andrestrocyte/MM_PyBpod2.git@a176c0e38520a4f29554198ae30711a08546d75d", "opencv-python>=4.0"]
dev = ["pytest==9.1.1", "mypy==2.2.0", "ruff==0.15.20", "types-PyYAML>=6.0"]

[project.scripts]
evil-rig = "hf_dm.operator_app:main"
hf-dm = "hf_dm.ops_cli:main"
hf-dm-run = "hf_dm.cli:main"
hf-dm-export-session = "hf_dm.data.session_export:main_export"
hf-dm-validate-session = "hf_dm.data.session_export:main_validate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hf_dm = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
follow_imports = "skip"

[[tool.mypy.overrides]]
# streamdio does not ship type information (py.typed) yet.
module = ["streamdio", "streamdio.*"]
ignore_missing_imports = true
